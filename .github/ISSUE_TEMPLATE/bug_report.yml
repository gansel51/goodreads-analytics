name: Bug Report
description: File a bug report to help us improve abi-python-utilities
labels: [bug]
title: "[Bug]: "

body:
  - type: input
    id: packages
    attributes:
      label: Environment
      description: Please provide any packages and their versions that are relevant to the bug
      placeholder: e.g., abi-utils-logging==1.0.0, pandas==1.5.3
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Please provide relevant environment details (OS, Python version, Databricks runtime if applicable)
      placeholder: e.g., Ubuntu 22.04, Python 3.11, Databricks Runtime 13.3
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Install abi-utils-logging
        2. Configure logging as per README
        3. Run the application
        4. Error appears in logs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Please paste logs, error messages, or screenshots if applicable
      render: shell

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true